<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<title>Times Dash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #4f46e5; --bg2: #7c3aed;
    --card: #ffffff; --ink: #1e1b4b; --muted: #6b7280;
    --good: #16a34a; --good-bg: #dcfce7;
    --bad: #dc2626; --bad-bg: #fee2e2;
    --gold: #f59e0b; --accent: #4f46e5;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100%; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .screen { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .hidden { display: none !important; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: 0 8px 24px rgba(30, 27, 75, .18); }
  h1, h2, h3 { margin: 0; }
  .white { color: #fff; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .center { text-align: center; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  .btn { border-radius: 16px; padding: 14px 18px; font-weight: 800; font-size: 18px; background: #eef2ff; color: var(--accent); }
  .btn.primary { background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #451a03; font-size: 26px; padding: 20px; box-shadow: 0 6px 0 #b45309; }
  .btn.primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309; }
  .btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
  .btn.danger { background: var(--bad-bg); color: var(--bad); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Home */
  .hello { font-size: clamp(20px, 6vw, 28px); font-weight: 900; }
  .level-bar { height: 14px; background: #e0e7ff; border-radius: 99px; overflow: hidden; }
  .level-bar > div { height: 100%; background: linear-gradient(90deg, #818cf8, #4f46e5); border-radius: 99px; transition: width .6s; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: #eef2ff; font-weight: 800; color: var(--accent); font-size: 15px; }
  .stat-big { font-size: 30px; font-weight: 900; }
  .stat-label { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .badge { text-align: center; padding: 8px 4px; border-radius: 14px; background: #f5f3ff; font-size: 11px; font-weight: 800; line-height: 1.15; }
  .badge .i { font-size: 28px; display: block; margin-bottom: 4px; }
  .badge.locked { filter: grayscale(1); opacity: .35; }
  .today { font-weight: 800; padding: 10px 14px; border-radius: 14px; text-align: center; }
  .today.done { background: var(--good-bg); color: var(--good); }
  .today.todo { background: #fef3c7; color: #92400e; }

  /* Game */
  .hud { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 900; font-size: 20px; }
  .timer-bar { height: 10px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
  .timer-bar > div { height: 100%; background: #fde68a; width: 100%; }
  .combo { font-size: 18px; min-height: 28px; text-align: center; color: #fde68a; font-weight: 900; }
  .combo.pop { animation: pop .3s; }
  @keyframes pop { 50% { transform: scale(1.35); } }
  .qcard { text-align: center; padding: 26px 12px; transition: background .15s; }
  .qcard.good { background: var(--good-bg); }
  .qcard.bad { background: var(--bad-bg); animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .question { font-size: clamp(40px, 14vw, 64px); font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
  .answer { display: inline-block; min-width: 1.6em; border-bottom: 5px solid var(--accent); color: var(--accent); }
  .answer.empty { color: #c7d2fe; }
  .correction { min-height: 26px; font-weight: 800; color: var(--bad); font-size: 20px; margin-top: 6px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
  .key { background: #fff; border-radius: 18px; font-size: 34px; font-weight: 900; padding: 16px 0; box-shadow: 0 5px 0 #c7d2fe; color: var(--ink); }
  .key:active, .key.down { transform: translateY(3px); box-shadow: 0 2px 0 #c7d2fe; }
  .key.go { background: var(--good); color: #fff; box-shadow: 0 5px 0 #166534; }
  .key.del { background: #e0e7ff; }
  .float { position: fixed; pointer-events: none; font-weight: 900; font-size: 26px; color: #fde68a; text-shadow: 0 2px 4px rgba(0,0,0,.3); animation: floatUp .8s forwards; }
  @keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }
  .overlay { position: fixed; inset: 0; background: rgba(30,27,75,.7); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .overlay .card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .countdown { font-size: 120px; font-weight: 900; color: #fff; animation: pop .8s infinite; }

  /* Results & stats */
  .trophy { font-size: 64px; text-align: center; }
  .mistake { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-weight: 700; }
  .mistake:last-child { border-bottom: 0; }
  .mistake .said { color: var(--bad); }
  .new-badge { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: #fef3c7; font-weight: 800; }
  .new-badge .i { font-size: 34px; }
  .pb { background: linear-gradient(90deg, #fde68a, #fbbf24); color: #451a03; font-weight: 900; text-align: center; border-radius: 14px; padding: 10px; }
  .mgrid { display: grid; grid-template-columns: 28px repeat(9, 1fr); gap: 3px; font-size: 12px; font-weight: 800; }
  .mgrid div { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
  .mgrid .h { color: var(--muted); }
  .m0 { background: #f1f5f9; color: #cbd5e1; }
  .m1 { background: #fecaca; color: #7f1d1d; }
  .m2 { background: #fde68a; color: #78350f; }
  .m3 { background: #86efac; color: #14532d; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid #f1f5f9; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  label.set { display: flex; justify-content: space-between; align-items: center; font-weight: 800; padding: 8px 0; gap: 10px; }
  input[type=text], select { font: inherit; font-weight: 700; padding: 10px 12px; border-radius: 12px; border: 2px solid #e0e7ff; min-width: 0; width: 150px; user-select: text; -webkit-user-select: text; }
  input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); }
  .subject { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .subject small { font-size: 15px; font-weight: 800; opacity: .75; }
  .lastrow { padding: 6px 0; font-weight: 700; font-size: 15px; gap: 8px; }
  .word { font-size: clamp(72px, 26vw, 120px); font-weight: 800; letter-spacing: 6px; line-height: 1.1; }
  .mic-wrap { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 12px; color: #fff; font-weight: 800; font-size: 18px; }
  .mic { width: 150px; height: 150px; border-radius: 50%; font-size: 64px; background: #fff; box-shadow: 0 8px 0 #c7d2fe; }
  .mic:active { transform: translateY(4px); box-shadow: 0 4px 0 #c7d2fe; }
  .mic.on { background: #ef4444; box-shadow: 0 0 0 0 rgba(255,255,255,.7); animation: pulse 1.1s infinite; }
  .mic:disabled { opacity: .35; }
  @keyframes pulse { to { box-shadow: 0 0 0 28px rgba(255,255,255,0); } }
  .tabs { display: flex; gap: 6px; background: rgba(255,255,255,.18); padding: 4px; border-radius: 16px; }
  .tab { flex: 1; padding: 10px; border-radius: 12px; font-weight: 800; color: #fff; background: transparent; font-size: 16px; }
  .tab.on { background: #fff; color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; font-size: 20px; }
  .chip small { font-size: 11px; font-weight: 700; }
  .plain { background: none; padding: 0; font-weight: 800; font-size: inherit; color: var(--ink); }
  .pin-dots { display: flex; justify-content: center; gap: 18px; margin: 24px 0 8px; }
  .pin-dots span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; }
  .pin-dots span.on { background: #fff; }
  .pin-dots.bad { animation: shake .35s; }
  .player { display: flex; align-items: center; gap: 14px; width: 100%; padding: 18px 16px; }
  .player:active { transform: scale(.98); }
  .avatar { width: 56px; height: 56px; border-radius: 50%; color: #fff; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pname { font-size: 24px; font-weight: 900; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<div id="app">

  <!-- LOCK -->
  <section id="lock" class="screen hidden"></section>

  <!-- PLAYERS -->
  <section id="players" class="screen hidden"></section>

  <!-- HOME -->
  <section id="home" class="screen"></section>

  <!-- GAME -->
  <section id="game" class="screen hidden">
    <div class="hud">
      <button class="btn ghost" id="pauseBtn" style="padding:8px 14px;font-size:16px">⏸</button>
      <div id="timeLeft">10:00</div>
      <div id="score">⭐ 0</div>
    </div>
    <div class="timer-bar"><div id="timerFill"></div></div>
    <div class="combo" id="combo">&nbsp;</div>
    <div class="card qcard" id="qcard">
      <div class="question"><span id="qa">9</span> × <span id="qb">5</span> = <span class="answer empty" id="ans">?</span></div>
      <div class="correction" id="correction"></div>
    </div>
    <div class="row between white" style="font-weight:800;padding:0 4px">
      <span id="countInfo">✅ 0 &nbsp; ❌ 0</span>
      <span id="avgInfo">⏱ –</span>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key del" data-k="del">⌫</button><button class="key" data-k="0">0</button><button class="key go" data-k="go">✓</button>
    </div>
  </section>

  <!-- READING -->
  <section id="read" class="screen hidden">
    <div class="hud">
      <button class="btn ghost" id="rPauseBtn" style="padding:8px 14px;font-size:16px">⏸</button>
      <div id="rTimeLeft">5:00</div>
      <div id="rScore">⭐ 0</div>
    </div>
    <div class="timer-bar"><div id="rTimerFill"></div></div>
    <div class="combo" id="rCombo">&nbsp;</div>
    <div class="card qcard" id="rcard">
      <div class="word" id="rword">cat</div>
      <div class="correction" id="rmsg"></div>
      <div class="row hidden" id="rfix" style="justify-content:center;margin-top:12px">
        <button class="btn" id="rRight">✓ It was right</button>
        <button class="btn" id="rNext">Next ➡</button>
      </div>
    </div>
    <div class="row between white" style="font-weight:800;padding:0 4px">
      <span id="rCount">✅ 0 &nbsp; ❌ 0</span>
      <span id="rAvg">⏱ –</span>
    </div>
    <div class="mic-wrap">
      <button class="mic" id="micBtn" aria-label="Record">🎤</button>
      <div id="micLabel">Tap 🎤 and read</div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen hidden"></section>

  <!-- STATS -->
  <section id="stats" class="screen hidden"></section>

  <!-- SETTINGS -->
  <section id="settings" class="screen hidden"></section>
</div>

<div class="overlay hidden" id="overlay"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';

/* ---------------- Data ---------------- */
const KEY = 'timesdash.v2', OLD_KEY = 'timesdash.v1';
const TITLES = ['Rookie', 'Counter', 'Quick Thinker', 'Number Ninja', 'Math Wizard', 'Speed Racer', 'Times Titan', 'Multiplication Master', 'Legend'];
const BADGES = [
  { id: 'first',   i: '🎉', name: 'First Dash',    desc: 'Finish a full maths session' },
  { id: 'combo10', i: '🔥', name: 'On Fire',       desc: '10 right in a row' },
  { id: 'combo25', i: '☄️', name: 'Blazing',       desc: '25 right in a row' },
  { id: 'combo50', i: '🌋', name: 'Unstoppable',   desc: '50 right in a row' },
  { id: 'q100',    i: '💯', name: 'Century',       desc: '100 answers in one session' },
  { id: 'q200',    i: '🚀', name: 'Rocket',        desc: '200 answers in one session' },
  { id: 'speed3',  i: '⚡', name: 'Quick',         desc: 'Average under 3 s (30+ answers)' },
  { id: 'speed2',  i: '🏎️', name: 'Lightning',     desc: 'Average under 2 s (30+ answers)' },
  { id: 'acc95',   i: '🎯', name: 'Sharpshooter',  desc: '95% right (50+ answers)' },
  { id: 'perfect', i: '💎', name: 'Flawless',      desc: '100% right (50+ answers)' },
  { id: 'day3',    i: '📅', name: 'Habit',         desc: '3-day streak' },
  { id: 'day7',    i: '🗓️', name: 'Week Warrior',  desc: '7-day streak' },
  { id: 'day30',   i: '👑', name: 'Monarch',       desc: '30-day streak' },
  { id: 'master',  i: '🧠', name: 'Grandmaster',   desc: 'Every fact green on the grid' },
  { id: 'read1',   i: '📖', name: 'First Reader',  desc: 'Finish a full reading session' },
  { id: 'rcombo10',i: '🗣️', name: 'Super Reader',  desc: '10 words right in a row' },
  { id: 'rwords50',i: '📚', name: 'Bookworm',      desc: 'Read 50 words in one session' },
  { id: 'rfast',   i: '🐇', name: 'Speedy Reader', desc: 'Average under 3 s (20+ words)' },
];

const COLORS = ['#f59e0b', '#ec4899', '#10b981', '#3b82f6', '#8b5cf6', '#ef4444'];
function fresh(name = '') {
  return {
    v: 2, name, xp: 0, badges: {},
    sessions: [], facts: {},          // maths
    readSessions: [], words: {},      // reading
    settings: { minutes: 5, includeOnes: false, sound: true, maths: true, reading: true, wordLen: 'both', accent: 'en-IN' },
  };
}

// R holds every player on this phone; S is the player currently playing.
let R = null, S = null;
try { R = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!R || !R.players) {
  R = { players: {}, order: [], current: null };
  // Carry over progress from the single-player version (times reset to 5 minutes).
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && (old.name || (old.sessions && old.sessions.length))) {
      old.settings = Object.assign({}, old.settings, { minutes: 5 });
      addPlayer(old.name || 'Player 1', old);
    }
  } catch {}
}
for (const id of R.order) {
  const p = R.players[id];
  R.players[id] = Object.assign(fresh(p.name), p, { settings: Object.assign(fresh().settings, p.settings) });
}

// A link like .../#players=Name1,Name2 adds those players on first open. Names stay on the phone.
const seed = location.hash.match(/players=([^&]+)/);
if (seed) {
  for (const n of decodeURIComponent(seed[1]).split(',').map((s) => s.trim().slice(0, 20)).filter(Boolean).slice(0, 6)) {
    if (!R.order.some((id) => R.players[id].name.toLowerCase() === n.toLowerCase())) addPlayer(n);
  }
  history.replaceState(null, '', location.pathname);
}

function addPlayer(name, data) {
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const p = Object.assign(fresh(name), data || {}, { name, v: 2 });
  p.settings = Object.assign(fresh().settings, p.settings);
  R.players[id] = p;
  R.order.push(id);
  return id;
}
function usePlayer(id) { R.current = id; S = R.players[id]; save(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(R));

/* ---------------- Helpers ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sec = (ms) => (ms / 1000).toFixed(1) + 's';
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const factKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);
const minFactor = () => (S.settings.includeOnes ? 1 : 2);

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('hidden', s.id !== id);
  window.scrollTo(0, 0);
}

function levelInfo(xp) {
  // XP needed to reach level L: 400 * L * (L - 1)
  let L = 1;
  while (xp >= 400 * (L + 1) * L) L++;
  const base = 400 * L * (L - 1), next = 400 * (L + 1) * L;
  return { level: L, title: TITLES[Math.min(TITLES.length - 1, Math.floor((L - 1) / 2))], pct: (xp - base) / (next - base), toNext: next - xp };
}

// A day counts for the streak if any subject was fully practised.
function dayStreak(p = S) {
  const done = new Set(p.sessions.concat(p.readSessions).filter((s) => s.completed).map((s) => s.day));
  const d = new Date();
  if (!done.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (done.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const didToday = (list) => list.some((s) => s.completed && s.day === dayKey(Date.now()));
function subjectsOf(p) {
  const out = [];
  if (p.settings.maths || !p.settings.reading) out.push('maths');
  if (p.settings.reading) out.push('reading');
  return out;
}
// "Done today" means every subject this player practises has a full session today.
const doneToday = (p = S) => subjectsOf(p).every((s) => didToday(s === 'maths' ? p.sessions : p.readSessions));

function factLevel(f) {
  // 0 = not tried, 1 = needs work, 2 = getting there, 3 = mastered
  if (!f || f.n === 0) return 0;
  const acc = f.c / f.n, avg = f.c ? f.ms / f.c : Infinity;
  if (f.n >= 3 && acc >= 0.9 && avg < 3000) return 3;
  if (acc >= 0.75 && avg < 5000) return 2;
  return 1;
}
function allMastered() {
  for (let a = minFactor(); a <= 9; a++) for (let b = a; b <= 9; b++) if (factLevel(S.facts[factKey(a, b)]) < 3) return false;
  return true;
}

/* ---------------- Sound & haptics ---------------- */
let actx;
function beep(freq, dur = 0.08, type = 'sine', vol = 0.15) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}
const sndGood = (combo) => beep(660 + Math.min(combo, 20) * 20, 0.09, 'triangle');
const sndBad = () => { beep(180, 0.2, 'sawtooth', 0.08); if (navigator.vibrate) navigator.vibrate(120); };
const sndFanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle'), i * 130));

/* ---------------- Confetti ---------------- */
function confetti(n = 140) {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#f87171'];
  const ps = Array.from({ length: n }, () => ({
    x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - 0.5) * 14, vy: Math.random() * -14 - 4,
    s: 6 + Math.random() * 6, c: colors[(Math.random() * colors.length) | 0], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
  }));
  let frames = 0;
  (function step() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
    if (++frames < 180) requestAnimationFrame(step); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ---------------- Game ---------------- */
let G = null;

function countdown(next) {
  const ov = $('#overlay');
  ov.classList.remove('hidden');
  let n = 3;
  const tick = () => {
    if (n === 0) { ov.classList.add('hidden'); next(); return; }
    ov.innerHTML = `<div class="countdown">${n}</div>`;
    beep(440, 0.1); n--;
    setTimeout(tick, 700);
  };
  tick();
}

function startGame() {
  G = {
    duration: S.settings.minutes * 60000, elapsed: 0, last: performance.now(), paused: false, over: false,
    q: null, input: '', locked: false, results: [], combo: 0, maxCombo: 0, points: 0, retry: [], startedAt: Date.now(),
  };
  show('game');
  updateHud();
  nextQuestion();
  requestAnimationFrame(loop);
}

function syncClock(st = G) {
  const now = performance.now();
  if (!st.paused) st.elapsed += now - st.last;
  st.last = now;
}

function loop() {
  if (!G || G.over) return;
  syncClock();
  const left = Math.max(0, G.duration - G.elapsed);
  const s = Math.ceil(left / 1000);
  $('#timeLeft').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('#timerFill').style.width = (100 * left) / G.duration + '%';
  $('#timerFill').style.background = left < 30000 ? '#fca5a5' : '#fde68a';
  if (left <= 0) return endGame(true);
  requestAnimationFrame(loop);
}

function pickFact() {
  // A fact he got wrong comes back a few questions later.
  const due = G.retry.findIndex((r) => r.at <= G.results.length);
  if (due >= 0) return G.retry.splice(due, 1)[0].f;
  const lo = minFactor(), pool = [];
  let total = 0;
  for (let a = lo; a <= 9; a++) for (let b = lo; b <= 9; b++) {
    if (G.q && G.q.a === a && G.q.b === b) continue;
    const f = S.facts[factKey(a, b)];
    let w = 1;
    if (!f) w += 1;
    else {
      const acc = f.c / f.n, avg = f.c ? f.ms / f.c : 6000;
      w += (1 - acc) * 5 + Math.min(3, Math.max(0, (avg - 2000) / 1000));
    }
    if (a === 1 || b === 1) w *= 0.3;
    pool.push({ a, b, w }); total += w;
  }
  let r = Math.random() * total;
  for (const p of pool) { if ((r -= p.w) <= 0) return p; }
  return pool[pool.length - 1];
}

function nextQuestion() {
  const f = pickFact();
  syncClock();
  G.q = { a: f.a, b: f.b, start: G.elapsed };
  G.input = '';
  G.locked = false;
  $('#qa').textContent = f.a;
  $('#qb').textContent = f.b;
  $('#qcard').className = 'card qcard';
  $('#correction').textContent = '';
  renderInput();
}

function renderInput() {
  const el = $('#ans');
  el.textContent = G.input || '?';
  el.classList.toggle('empty', !G.input);
}

function press(k) {
  if (!G || G.over || G.paused || G.locked) return;
  if (k === 'del') G.input = G.input.slice(0, -1);
  else if (k === 'go') { if (G.input) submit(); return; }
  else if (G.input.length < 2) G.input += k;
  renderInput();
}

function submit() {
  syncClock();
  const { a, b } = G.q;
  const ms = G.elapsed - G.q.start;
  const given = parseInt(G.input, 10);
  const ok = given === a * b;
  G.results.push({ a, b, given, ok, ms });
  G.locked = true;

  // Long thinking pauses (e.g. distracted) are capped so they don't skew his averages.
  const fk = factKey(a, b);
  const f = (S.facts[fk] = S.facts[fk] || { n: 0, c: 0, ms: 0 });
  f.n++;
  if (ok) { f.c++; f.ms += Math.min(ms, 15000); }

  if (ok) {
    G.combo++;
    G.maxCombo = Math.max(G.maxCombo, G.combo);
    const mult = G.combo >= 20 ? 4 : G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1;
    const speed = ms < 1500 ? 10 : ms < 2500 ? 6 : ms < 4000 ? 3 : 0;
    const pts = (10 + speed) * mult;
    G.points += pts;
    floatText('+' + pts);
    $('#qcard').classList.add('good');
    sndGood(G.combo);
    setTimeout(nextQuestion, 220);
  } else {
    G.combo = 0;
    G.retry.push({ f: { a, b }, at: G.results.length + 3 });
    $('#qcard').classList.add('bad');
    $('#correction').textContent = `${a} × ${b} = ${a * b}`;
    sndBad();
    setTimeout(nextQuestion, 1300);
  }
  updateHud();
}

function floatText(t, sel = '#qcard') {
  const r = $(sel).getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = t;
  el.style.left = r.left + r.width / 2 - 20 + 'px';
  el.style.top = r.top + 10 + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function updateHud() {
  const good = G.results.filter((r) => r.ok).length, bad = G.results.length - good;
  $('#score').textContent = '⭐ ' + G.points.toLocaleString();
  $('#countInfo').innerHTML = `✅ ${good} &nbsp; ❌ ${bad}`;
  const avg = G.results.length ? G.results.reduce((s, r) => s + r.ms, 0) / G.results.length : 0;
  $('#avgInfo').textContent = '⏱ ' + (G.results.length ? sec(avg) : '–');
  const c = $('#combo');
  const mult = G.combo >= 20 ? 4 : G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1;
  c.innerHTML = G.combo >= 3 ? `🔥 ${G.combo} in a row${mult > 1 ? ` · x${mult} points` : ''}` : '&nbsp;';
  if (G.combo >= 3) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
}

function pause() {
  const st = G || RG; // whichever game (maths or reading) is running
  if (!st || st.over || st.paused) return;
  syncClock(st);
  st.paused = true;
  if (st.rec) { try { st.rec.abort(); } catch {} }
  const ov = $('#overlay');
  ov.innerHTML = `<div class="card">
      <h2>Paused ⏸</h2>
      <div class="muted" style="font-weight:700">The clock is stopped.</div>
      <button class="btn primary" id="resumeBtn">▶ Keep going</button>
      <button class="btn danger" id="quitBtn">Stop early</button>
      <div class="muted" style="font-size:13px">Stopping early won't count toward the daily streak.</div>
    </div>`;
  ov.classList.remove('hidden');
  $('#resumeBtn').onclick = () => { ov.classList.add('hidden'); st.last = performance.now(); st.paused = false; };
  $('#quitBtn').onclick = () => { ov.classList.add('hidden'); st.paused = false; st === G ? endGame(false) : endReading(false); };
}

function endGame(completed) {
  if (G.over) return;
  G.over = true;
  const R = G.results;
  const total = R.length, correct = R.filter((r) => r.ok).length;
  if (total === 0) { save(); G = null; renderHome(); return; }

  const prevBest = S.sessions.filter((s) => s.total >= 30).reduce((m, s) => Math.min(m, s.avgMs), Infinity);
  const prevMostCorrect = S.sessions.reduce((m, s) => Math.max(m, s.correct), 0);

  const session = {
    day: dayKey(G.startedAt), at: G.startedAt, completed, minutes: S.settings.minutes,
    total, correct, avgMs: R.reduce((s, r) => s + r.ms, 0) / total,
    avgCorrectMs: correct ? R.filter((r) => r.ok).reduce((s, r) => s + r.ms, 0) / correct : 0,
    points: G.points, maxCombo: G.maxCombo,
    mistakes: R.filter((r) => !r.ok).map((r) => [r.a, r.b, r.given]),
  };
  S.sessions.push(session);
  if (S.sessions.length > 400) S.sessions.splice(0, S.sessions.length - 400);
  const levelBefore = levelInfo(S.xp).level;
  S.xp += G.points + (completed ? 200 : 0);
  const levelAfter = levelInfo(S.xp).level;

  const acc = correct / total, streak = dayStreak();
  const earned = {
    first: completed,
    combo10: G.maxCombo >= 10, combo25: G.maxCombo >= 25, combo50: G.maxCombo >= 50,
    q100: total >= 100, q200: total >= 200,
    speed3: total >= 30 && session.avgMs < 3000, speed2: total >= 30 && session.avgMs < 2000,
    acc95: total >= 50 && acc >= 0.95, perfect: total >= 50 && acc === 1,
    day3: streak >= 3, day7: streak >= 7, day30: streak >= 30,
    master: allMastered(),
  };
  const newBadges = BADGES.filter((b) => earned[b.id] && !S.badges[b.id]);
  for (const b of newBadges) S.badges[b.id] = Date.now();
  save();

  const pbs = [];
  if (total >= 30 && session.avgMs < prevBest) pbs.push(prevBest === Infinity ? 'First speed record set!' : `New speed record! ${sec(session.avgMs)} (was ${sec(prevBest)})`);
  if (correct > prevMostCorrect && prevMostCorrect > 0) pbs.push(`Most correct ever: ${correct}!`);
  if (levelAfter > levelBefore) pbs.push(`Level up! You're now level ${levelAfter} 🎊`);

  renderResults(session, newBadges, pbs);
  G = null;
  if (completed || newBadges.length || pbs.length) { confetti(); sndFanfare(); }
}

/* ---------------- Results ---------------- */
function renderResults(s, newBadges, pbs, kind = 'maths') {

      <div><div class="stat-big">${sec(s.avgMs)}</div><div class="stat-label">Avg / ${reading ? 'word' : 'question'}</div></div>
      <div><div class="stat-big">🔥 ${s.maxCombo}</div><div class="stat-label">Best streak</div></div>
      <div style="grid-column:span 2"><div class="stat-big">⭐ ${s.points.toLocaleString()}${s.completed ? ' + 200' : ''}</div><div class="stat-label">Points earned${s.completed ? ' (+200 finish bonus)' : ''}</div></div>
    </div>

  show('results');
}

/* ---------------- Stats ---------------- */
function renderStats(kind = 'maths') {
  const reading = kind === 'reading';
  const list = reading ? S.readSessions : S.sessions;
  const unit = reading ? 'word' : 'question';
  const done = list.filter((s) => s.total >= 5).slice(-14);
  const maxAvg = Math.max(4000, ...done.map((s) => s.avgMs));
  const W = 320, H = 140, bw = W / Math.max(done.length, 7);
  const bars = done.map((s, i) => {
    const h = Math.max(4, ((H - 24) * s.avgMs) / maxAvg);
    const acc = s.correct / s.total;
    const col = acc >= 0.9 ? '#22c55e' : acc >= 0.75 ? '#f59e0b' : '#ef4444';
    return `<rect x="${i * bw + 3}" y="${H - 16 - h}" width="${bw - 6}" height="${h}" rx="4" fill="${col}"/>
      <text x="${i * bw + bw / 2}" y="${H - 20 - h}" text-anchor="middle" font-size="10" font-weight="800" fill="#1e1b4b">${(s.avgMs / 1000).toFixed(1)}</text>
      <text x="${i * bw + bw / 2}" y="${H - 3}" text-anchor="middle" font-size="9" fill="#6b7280">${s.day.slice(8)}/${s.day.slice(5, 7)}</text>`;
  }).join('');

  const lo = minFactor();
  let grid = '<div class="h">×</div>';
  for (let b = lo; b <= 9; b++) grid += `<div class="h">${b}</div>`;
  for (let a = lo; a <= 9; a++) {
    grid += `<div class="h">${a}</div>`;
    for (let b = lo; b <= 9; b++) {
      const f = S.facts[factKey(a, b)], lv = factLevel(f);
      const avg = f && f.c ? (f.ms / f.c / 1000).toFixed(1) : '';
      grid += `<div class="m${lv}" title="${a}×${b}">${lv ? avg : a * b}</div>`;
    }
  }
  const cols = 10 - lo;

  const recent = list.slice(-20).reverse();
  const totalQ = list.reduce((s, x) => s + x.total, 0);
  const totalC = list.reduce((s, x) => s + x.correct, 0);
  const best = list.filter((s) => s.total >= (reading ? 20 : 30)).reduce((m, s) => Math.min(m, s.avgMs), Infinity);

  // Reading: the words she finds hardest (lowest accuracy, then slowest).
  const tricky = Object.entries(S.words)
    .map(([w, st]) => ({ w, acc: st.c / st.n, avg: st.c ? st.ms / st.c : 99999, n: st.n }))
    .filter((x) => x.acc < 1 || x.avg > 4000)
    .sort((a, b) => a.acc - b.acc || b.avg - a.avg)
    .slice(0, 15);
  const subs = subjectsOf(S);

  $('#stats').innerHTML = `
    <div class="row between"><h1 class="white">Progress</h1><button class="btn ghost" id="backBtn">← Back</button></div>
    ${subs.length > 1 ? `<div class="tabs">
      <button class="tab ${reading ? '' : 'on'}" data-k="maths">✖️ Maths</button>
      <button class="tab ${reading ? 'on' : ''}" data-k="reading">📖 Reading</button>
    </div>` : ''}
    <div class="card grid2 center">
      <div><div class="stat-big">${list.filter((s) => s.completed).length}</div><div class="stat-label">Sessions done</div></div>
      <div><div class="stat-big">${totalQ.toLocaleString()}</div><div class="stat-label">${reading ? 'Words read' : 'Questions'}</div></div>
      <div><div class="stat-big">${totalQ ? Math.round((100 * totalC) / totalQ) : 0}%</div><div class="stat-label">Overall accuracy</div></div>
      <div><div class="stat-big">${best === Infinity ? '–' : sec(best)}</div><div class="stat-label">Best avg speed</div></div>
    </div>
    <div class="card">
      <h3>Seconds per ${unit}</h3>
      <div class="muted" style="font-size:13px;font-weight:700;margin-bottom:8px">Shorter bars are faster. Colour shows accuracy.</div>
      ${done.length ? `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>` : '<div class="muted center" style="padding:20px">Play a session to see your chart.</div>'}
      <div class="legend"><span style="--c:#22c55e">90%+</span><span style="--c:#f59e0b">75–89%</span><span style="--c:#ef4444">under 75%</span></div>
    </div>
    ${reading ? `
    <div class="card">
      <h3>Tricky words</h3>
      <div class="muted" style="font-size:13px;font-weight:700;margin-bottom:8px">Words missed or read slowly. They come up more often. Tap to hear one.</div>
      ${tricky.length ? `<div class="chips">${tricky.map((t) => `<button class="chip ${t.acc < 0.75 ? 'm1' : 'm2'} sayit" data-w="${esc(t.w)}"><b>${esc(t.w)}</b><small>${Math.round(t.acc * 100)}%${t.avg < 99999 ? ' · ' + sec(t.avg) : ''}</small></button>`).join('')}</div>`
        : '<div class="muted center" style="padding:12px">No tricky words yet. 🌟</div>'}
    </div>` : `
    <div class="card">
      <h3>Times-table map</h3>
      <div class="muted" style="font-size:13px;font-weight:700;margin-bottom:8px">Each square shows average seconds for that fact.</div>
      <div class="mgrid" style="grid-template-columns:28px repeat(${cols}, 1fr)">${grid}</div>
      <div class="legend" style="margin-top:10px"><span style="--c:#86efac">Mastered</span><span style="--c:#fde68a">Getting there</span><span style="--c:#fecaca">Needs practice</span><span style="--c:#f1f5f9">Not tried</span></div>
    </div>`}
    <div class="card">
      <h3 style="margin-bottom:6px">Recent sessions</h3>
      ${recent.length ? `<table><tr><th>Date</th><th>Right</th><th>Acc</th><th>Avg</th><th>Pts</th></tr>
        ${recent.map((s) => `<tr><td>${new Date(s.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}${s.completed ? '' : ' ⏹'}</td><td>${s.correct}/${s.total}</td><td>${Math.round((100 * s.correct) / s.total)}%</td><td>${sec(s.avgMs)}</td><td>${s.points}</td></tr>`).join('')}
      </table><div class="muted" style="font-size:12px;margin-top:6px">⏹ = stopped early</div>` : '<div class="muted">No sessions yet.</div>'}
    </div>
  `;
  $('#backBtn').onclick = renderHome;
  for (const t of document.querySelectorAll('#stats .tab')) t.onclick = () => renderStats(t.dataset.k);
  for (const b of document.querySelectorAll('#stats .sayit')) b.onclick = () => sayWord(b.dataset.w);
}

/* ---------------- Settings ---------------- */
function renderSettings() {
  $('#settings').innerHTML = `
    <div class="row between"><h1 class="white">Settings</h1><button class="btn ghost" id="backBtn2">← Back</button></div>
    <div class="card">
      <label class="set">Player name <input type="text" id="setName" maxlength="20" value="${esc(S.name)}" placeholder="Name"></label>
      <label class="set">Minutes per day
        <select id="setMin">${[2, 5, 10, 15].map((m) => `<option value="${m}" ${S.settings.minutes === m ? 'selected' : ''}>${m} minutes</option>`).join('')}</select>
      </label>
      <label class="set">Sounds <input type="checkbox" id="setSound" ${S.settings.sound ? 'checked' : ''}></label>
    </div>
    <div class="card">
      <h3>✖️ Maths</h3>
      <label class="set">Show maths <input type="checkbox" id="setMaths" ${S.settings.maths ? 'checked' : ''}></label>
      <label class="set">Include ×1 facts <input type="checkbox" id="setOnes" ${S.settings.includeOnes ? 'checked' : ''}></label>
    </div>
    <div class="card">
      <h3>📖 Reading</h3>
      <label class="set">Show reading <input type="checkbox" id="setReading" ${S.settings.reading ? 'checked' : ''}></label>
      <label class="set">Words
        <select id="setLen">${[['3', '3 letters'], ['4', '4 letters'], ['both', '3 and 4 letters']].map(([v, t]) => `<option value="${v}" ${S.settings.wordLen === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </label>
      <label class="set">Listen for
        <select id="setAccent">${[['en-IN', 'Indian English'], ['en-GB', 'British English'], ['en-US', 'American English']].map(([v, t]) => `<option value="${v}" ${S.settings.accent === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </label>
      <p class="muted" style="font-weight:600;font-size:13px;margin:4px 0 0">Reading uses the phone's speech recognition, which needs the internet. If it mishears a word, tap “It was right”.</p>
    </div>
    <div class="card">
      <h3>For parents</h3>
      <p class="muted" style="font-weight:600;font-size:14px">Each player has their own progress. Facts a player gets wrong or answers slowly come up more often, and a missed fact returns a few questions later. Time spent paused doesn't count. Progress is saved on this phone only.</p>
      <button class="btn danger" id="resetBtn" style="width:100%">Reset ${esc(S.name)}'s progress</button>
      <button class="btn danger" id="removeBtn" style="width:100%;margin-top:10px">Remove ${esc(S.name)}</button>
    </div>
  `;
  const back = () => {
    S.name = $('#setName').value.trim().slice(0, 20) || S.name;
    S.settings.minutes = parseInt($('#setMin').value, 10);
    S.settings.includeOnes = $('#setOnes').checked;
    S.settings.sound = $('#setSound').checked;
    S.settings.maths = $('#setMaths').checked;
    S.settings.reading = $('#setReading').checked;
    S.settings.wordLen = $('#setLen').value;
    S.settings.accent = $('#setAccent').value;
    save();
    renderHome();
  };
  $('#backBtn2').onclick = back;
  $('#resetBtn').onclick = () => {
    if (confirm('Erase all sessions, XP and badges? This cannot be undone.')) {
      S = R.players[R.current] = fresh(S.name);
      save(); renderHome();
    }
  };
  $('#removeBtn').onclick = () => {
    if (confirm(`Remove ${S.name} and all their progress? This cannot be undone.`)) {
      delete R.players[R.current];
      R.order = R.order.filter((id) => id !== R.current);
      R.current = null; S = null;
      save(); renderPlayers();
    }
  };
}

/* ---------------- Reading ---------------- */
// Simple decodable words. Words that sound like another word list the other spelling in SOUNDS_LIKE,
// because speech recognition may write either.
const WORDS3 = `cat bat hat mat rat sat fat pat van can fan man pan ran jam ham bag rag tag wag cap map tap nap lap
  bed red fed hen pen ten men net wet jet vet pet leg peg beg web yes big dig wig pig fig bin pin tin win fin
  kid lid hid lip hip dip zip sit hit kit fit six mix fix box fox dog log fog jog hop mop top pop pot hot dot not
  rod nod job cub tub rub bus bun run fun sun nut cut hut but bug rug hug mug jug pup cup mud bud gum hum yum ant egg end ask`.trim().split(/\s+/);
const WORDS4 = `frog fish duck milk jump hand sand lamp desk nest tent bell ball doll hill fill shop ship chip chin that this
  then with drum crab flag clap plum spot stop swim snap grin belt gift list best rest help sock rock lock kick back pack
  ring sing king wing song long bath moth much rich park star card farm corn fork bird girl turn tall wall cold gold hold
  fast last mask pink sink bank tank pond book look cook moon soon tree feet seed jeep cake bike home kite rope`.trim().split(/\s+/);
const SOUNDS_LIKE = { sun: ['son'], ten: ['10'], six: ['6'], red: ['read'], ant: ['aunt'], not: ['knot'], ring: ['wring'], feet: ['feat'], but: ['butt'] };
const MIC_ERRORS = {
  'no-speech': "I didn't hear anything. Tap 🎤 and read again.",
  'not-allowed': 'Please allow the microphone for Times Dash, then tap 🎤.',
  'service-not-allowed': 'Please allow the microphone for Times Dash, then tap 🎤.',
  'network': 'Listening needs the internet. Check Wi-Fi and tap 🎤 again.',
  'audio-capture': "The microphone isn't working. Tap 🎤 to try again.",
};
const speechRec = () => window.SpeechRecognition || window.webkitSpeechRecognition;
const comboMult = (c) => (c >= 20 ? 4 : c >= 10 ? 3 : c >= 5 ? 2 : 1);
let RG = null;

function sayWord(w) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(w);
  u.lang = (S && S.settings.accent) || 'en-IN';
  u.rate = 0.8;
  speechSynthesis.speak(u);
}

function infoOverlay(icon, title, text) {
  const ov = $('#overlay');
  ov.innerHTML = `<div class="card"><div style="font-size:48px">${icon}</div><h2>${title}</h2>
    <div class="muted" style="font-weight:700">${text}</div><button class="btn primary" id="okBtn">OK</button></div>`;
  ov.classList.remove('hidden');
  $('#okBtn').onclick = () => ov.classList.add('hidden');
}

function startReadingFlow() {
  if (!speechRec()) return infoOverlay('🎤', 'Reading needs Chrome', "This browser can't listen. Open Times Dash in Chrome on Android.");
  countdown(startReading);
}

function startReading() {
  RG = {
    duration: S.settings.minutes * 60000, elapsed: 0, last: performance.now(), paused: false, over: false,
    word: null, shownAt: 0, results: [], combo: 0, prevCombo: 0, maxCombo: 0, points: 0, retry: [], recent: [],
    rec: null, listening: false, waiting: false, startedAt: Date.now(),
  };
  show('read');
  updateReadHud();
  nextWord();
  requestAnimationFrame(readLoop);
}

function readLoop() {
  if (!RG || RG.over) return;
  syncClock(RG);
  const left = Math.max(0, RG.duration - RG.elapsed), s = Math.ceil(left / 1000);
  $('#rTimeLeft').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('#rTimerFill').style.width = (100 * left) / RG.duration + '%';
  $('#rTimerFill').style.background = left < 30000 ? '#fca5a5' : '#fde68a';
  if (left <= 0) return endReading(true);
  requestAnimationFrame(readLoop);
}

function wordPool() {
  const L = S.settings.wordLen;
  return L === '3' ? WORDS3 : L === '4' ? WORDS4 : WORDS3.concat(WORDS4);
}

function pickWord() {
  // A missed word comes back a few words later; otherwise missed or slow words are picked more often.
  const due = RG.retry.findIndex((r) => r.at <= RG.results.length);
  if (due >= 0) return RG.retry.splice(due, 1)[0].w;
  const pool = [];
  let total = 0;
  for (const w of wordPool()) {
    if (RG.recent.includes(w)) continue;
    const st = S.words[w];
    let wt = 1;
    if (!st) wt += 0.5;
    else {
      const acc = st.c / st.n, avg = st.c ? st.ms / st.c : 6000;
      wt += (1 - acc) * 5 + Math.min(3, Math.max(0, (avg - 2500) / 1000));
    }
    pool.push({ w, wt }); total += wt;
  }
  let r = Math.random() * total;
  for (const p of pool) { if ((r -= p.wt) <= 0) return p.w; }
  return pool[pool.length - 1].w;
}

function nextWord() {
  if (!RG || RG.over) return;
  const w = pickWord();
  RG.word = w;
  RG.recent.push(w);
  if (RG.recent.length > 12) RG.recent.shift();
  syncClock(RG);
  RG.shownAt = RG.elapsed;
  RG.waiting = false;
  RG.busy = false;
  $('#rword').textContent = w;
  $('#rcard').className = 'card qcard';
  $('#rmsg').textContent = '';
  $('#rfix').classList.add('hidden');
  setMic(false);
}

function setMic(on) {
  RG.listening = on;
  const b = $('#micBtn');
  b.classList.toggle('on', on);
  b.disabled = RG.waiting;
  $('#micLabel').textContent = RG.waiting ? ' ' : on ? 'Listening… read the word' : 'Tap 🎤 and read';
}

const heardWord = (text, word) => {
  const accept = [word].concat(SOUNDS_LIKE[word] || []);
  return text.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').some((x) => accept.includes(x));
};

function listen() {
  if (!RG || RG.over || RG.paused || RG.waiting || RG.busy) return;
  if (RG.listening) { try { RG.rec.stop(); } catch {} return; }
  const rec = new (speechRec())();
  rec.lang = S.settings.accent;
  rec.interimResults = true; // lets us accept the word as soon as it's heard
  rec.maxAlternatives = 5;
  rec.continuous = false;
  const word = RG.word;
  let settled = false;
  const settle = () => { settled = true; if (RG) { RG.rec = null; setMic(false); } };
  const stop = () => { try { rec.abort(); } catch {} };

  rec.onresult = (e) => {
    if (settled || !RG || RG.word !== word) return;
    let best = '';
    for (let i = 0; i < e.results.length; i++) {
      for (let j = 0; j < e.results[i].length; j++) {
        const t = e.results[i][j].transcript;
        if (!best) best = t;
        if (heardWord(t, word)) { settle(); stop(); return judgeWord(true, t); }
      }
    }
    if (e.results[e.results.length - 1].isFinal) { settle(); stop(); judgeWord(false, best); }
  };
  rec.onerror = (e) => {
    if (settled) return;
    settle();
    if (e.error !== 'aborted' && RG) $('#rmsg').textContent = MIC_ERRORS[e.error] || 'Something went wrong. Tap 🎤 to try again.';
  };
  rec.onend = () => {
    if (settled) return;
    settle();
    if (RG) $('#rmsg').textContent = "I didn't catch that. Tap 🎤 and read again.";
  };

  RG.rec = rec;
  $('#rmsg').textContent = '';
  setMic(true);
  try { rec.start(); } catch { settle(); }
}

function judgeWord(ok, heardText) {
  if (!RG || RG.over) return;
  syncClock(RG);
  const w = RG.word, ms = RG.elapsed - RG.shownAt;
  const st = (S.words[w] = S.words[w] || { n: 0, c: 0, ms: 0 });
  st.n++;
  RG.results.push({ w, ok, ms, heard: (heardText || '').trim() });
  if (ok) return rewardWord(ms, st);

  RG.prevCombo = RG.combo;
  RG.combo = 0;
  RG.retry.push({ w, at: RG.results.length + 3 });
  RG.waiting = true;
  $('#rcard').classList.add('bad');
  $('#rmsg').textContent = `I heard “${(heardText || '').trim() || '…'}”`;
  $('#rfix').classList.remove('hidden');
  setMic(false);
  sndBad();
  setTimeout(() => sayWord(w), 350);
  updateReadHud();
}

function rewardWord(ms, st) {
  st.c++;
  st.ms += Math.min(ms, 15000); // long pauses are capped so they don't skew her averages
  RG.combo++;
  RG.maxCombo = Math.max(RG.maxCombo, RG.combo);
  const speed = ms < 2000 ? 10 : ms < 3500 ? 6 : ms < 5000 ? 3 : 0;
  const pts = (10 + speed) * comboMult(RG.combo);
  RG.points += pts;
  floatText('+' + pts, '#rcard');
  $('#rcard').className = 'card qcard good';
  sndGood(RG.combo);
  updateReadHud();
  RG.busy = true; // ignore the mic during the short "correct" flash
  setTimeout(nextWord, 450);
}

// The parent (or child) says the app misheard: count it as right.
function markRight() {
  if (!RG || !RG.waiting) return;
  const r = RG.results[RG.results.length - 1];
  if (!r || r.ok) return;
  r.ok = true;
  r.fixed = true;
  RG.retry = RG.retry.filter((x) => x.w !== r.w);
  RG.combo = RG.prevCombo;
  RG.waiting = false;
  $('#rfix').classList.add('hidden');
  $('#rmsg').textContent = '';
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  rewardWord(r.ms, S.words[r.w]);
}

function updateReadHud() {
  const good = RG.results.filter((r) => r.ok).length, bad = RG.results.length - good;
  $('#rScore').textContent = '⭐ ' + RG.points.toLocaleString();
  $('#rCount').innerHTML = `✅ ${good} &nbsp; ❌ ${bad}`;
  const avg = RG.results.length ? RG.results.reduce((s, r) => s + r.ms, 0) / RG.results.length : 0;
  $('#rAvg').textContent = '⏱ ' + (RG.results.length ? sec(avg) : '–');
  const c = $('#rCombo'), m = comboMult(RG.combo);
  c.innerHTML = RG.combo >= 3 ? `🔥 ${RG.combo} in a row${m > 1 ? ` · x${m} points` : ''}` : '&nbsp;';
  if (RG.combo >= 3) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
}

function endReading(completed) {
  if (!RG || RG.over) return;
  RG.over = true;
  if (RG.rec) { try { RG.rec.abort(); } catch {} }
  const list = RG.results, total = list.length, correct = list.filter((r) => r.ok).length;
  if (total === 0) { save(); RG = null; renderHome(); return; }

  const prevBest = S.readSessions.filter((s) => s.total >= 20).reduce((m, s) => Math.min(m, s.avgMs), Infinity);
  const prevMost = S.readSessions.reduce((m, s) => Math.max(m, s.correct), 0);
  const session = {
    day: dayKey(RG.startedAt), at: RG.startedAt, completed, minutes: S.settings.minutes,
    total, correct, avgMs: list.reduce((s, r) => s + r.ms, 0) / total,
    points: RG.points, maxCombo: RG.maxCombo,
    mistakes: list.filter((r) => !r.ok).map((r) => [r.w, r.heard]),
  };
  S.readSessions.push(session);
  if (S.readSessions.length > 400) S.readSessions.splice(0, S.readSessions.length - 400);
  const levelBefore = levelInfo(S.xp).level;
  S.xp += RG.points + (completed ? 200 : 0);
  const levelAfter = levelInfo(S.xp).level;

  const streak = dayStreak();
  const earned = {
    read1: completed, rcombo10: RG.maxCombo >= 10, rwords50: total >= 50, rfast: total >= 20 && session.avgMs < 3000,
    day3: streak >= 3, day7: streak >= 7, day30: streak >= 30,
  };
  const newBadges = BADGES.filter((b) => earned[b.id] && !S.badges[b.id]);
  for (const b of newBadges) S.badges[b.id] = Date.now();
  save();

  const pbs = [];
  if (total >= 20 && session.avgMs < prevBest) pbs.push(prevBest === Infinity ? 'First reading speed record set!' : `New reading record! ${sec(session.avgMs)} (was ${sec(prevBest)})`);
  if (correct > prevMost && prevMost > 0) pbs.push(`Most words ever: ${correct}!`);
  if (levelAfter > levelBefore) pbs.push(`Level up! You're now level ${levelAfter} 🎊`);

  renderResults(session, newBadges, pbs, 'reading');
  RG = null;
  if (completed || newBadges.length || pbs.length) { confetti(); sndFanfare(); }
}

$('#micBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); listen(); });
$('#rPauseBtn').onclick = pause;
$('#rRight').onclick = markRight;
$('#rNext').onclick = () => { if (RG && RG.waiting) nextWord(); };

/* ---------------- Input wiring ---------------- */
$('#keypad').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.key');
  if (!b) return;
  e.preventDefault();
  b.classList.add('down');
  setTimeout(() => b.classList.remove('down'), 90);
  press(b.dataset.k);
});
document.addEventListener('keydown', (e) => {
  if (RG) {
    if (e.key === ' ') { e.preventDefault(); listen(); }
    else if (e.key === 'Escape') pause();
    return;
  }
  if (!G) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Enter') press('go');
  else if (e.key === 'Escape') pause();
});
$('#pauseBtn').onclick = pause;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------------- Family PIN lock ---------------- */
// Only a hash of the PIN is stored here; set it with ./set-pin.sh. Empty means no lock.
// Each phone asks once, then stays unlocked until the PIN changes.
const PIN_HASH = '';
const UNLOCK_KEY = 'timesdash.unlock';

async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, '0')).join('');
}

function renderLock(onUnlock) {
  let pin = '', fails = 0, waitUntil = 0, checking = false;
  $('#lock').innerHTML = `
    <div class="center white" style="margin-top:40px">
      <div style="font-size:56px">🔒</div>
      <h1>Times Dash</h1>
      <div style="font-weight:700;opacity:.85;margin-top:6px">Ask a grown-up to enter the family PIN</div>
    </div>
    <div class="pin-dots" id="pinDots">${'<span></span>'.repeat(4)}</div>
    <div class="center white" id="pinMsg" style="min-height:24px;font-weight:800"></div>
    <div class="keypad" id="pinPad">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button class="key" data-k="${n}">${n}</button>`).join('')}
      <span></span><button class="key" data-k="0">0</button><button class="key del" data-k="del">⌫</button>
    </div>`;
  const dots = () => document.querySelectorAll('#pinDots span').forEach((d, i) => d.classList.toggle('on', i < pin.length));
  $('#pinPad').addEventListener('pointerdown', async (e) => {
    const b = e.target.closest('.key');
    if (!b || checking) return;
    e.preventDefault();
    if (Date.now() < waitUntil) return;
    $('#pinMsg').textContent = '';
    if (b.dataset.k === 'del') pin = pin.slice(0, -1);
    else if (pin.length < 4) pin += b.dataset.k;
    dots();
    if (pin.length < 4) return;
    checking = true;
    const ok = (await sha256('timesdash:' + pin)) === PIN_HASH;
    checking = false;
    if (ok) { localStorage.setItem(UNLOCK_KEY, PIN_HASH); onUnlock(); return; }
    pin = ''; fails++;
    const d = $('#pinDots');
    d.classList.remove('bad'); void d.offsetWidth; d.classList.add('bad');
    if (navigator.vibrate) navigator.vibrate(150);
    if (fails >= 5) {
      waitUntil = Date.now() + 30000; fails = 0;
      $('#pinMsg').textContent = 'Too many tries. Wait 30 seconds.';
      setTimeout(() => { $('#pinMsg').textContent = ''; }, 30000);
    } else $('#pinMsg').textContent = 'Wrong PIN, try again';
    setTimeout(dots, 350);
  });
  show('lock');
}

// With one player go straight in; with several, ask who's playing each time the app opens.
function startApp() {
  if (R.order.length === 1) { usePlayer(R.order[0]); renderHome(); }
  else renderPlayers();
}
if (PIN_HASH && localStorage.getItem(UNLOCK_KEY) !== PIN_HASH) renderLock(startApp);
else startApp();
</script>
